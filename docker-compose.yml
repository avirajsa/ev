version: '3.8'

services:
  ev-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://ev_user:ev_password@postgres:5432/ev_db
      - REDIS_URL=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-anthropic/claude-3.5-sonnet}
      - FALLBACK_MODELS=${FALLBACK_MODELS:-["openai/gpt-4o","google/gemini-2.0-flash-001","meta-llama/llama-3.3-70b-instruct"]}
      - DEVICE_AUTH_SECRET=${DEVICE_AUTH_SECRET:-ev_device_shared_secret_token_12345}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ev_postgres
    environment:
      POSTGRES_USER: ev_user
      POSTGRES_PASSWORD: ev_password
      POSTGRES_DB: ev_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_user -d ev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ev_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
